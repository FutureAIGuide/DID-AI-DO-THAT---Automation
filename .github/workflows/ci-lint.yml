name: CI checks

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/**'
  push:
    branches:
      - master
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint-action@v1
        with:
          shellcheck_flags: '-e SC2086'

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Compile all embedded/shared Python
        run: python -m py_compile scripts/dadt_common.py
      - name: Run unit tests
        run: python -m pytest scripts/tests -v
